<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 930 280" role="img" aria-label="Shared circuits: a 10 k / 10 k divider buffered by the spare op-amp half makes VMID at 1.65 volts; a 10 k trim pot filtered by 10 k and 1 microfarad makes VTH; the Heltec 3V3 pin feeds the analog rail through a ferrite bead with 10 microfarad and 100 nanofarad decoupling." font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="none" stroke="#1b1d21" stroke-width="1.5"><rect x="-10" y="0" width="930" height="280" fill="#ffffff" stroke="none"/>
  <defs>
    <g id="g3"><line x1="-10" y1="0" x2="10" y2="0"/><line x1="-6" y1="4" x2="6" y2="4"/><line x1="-2" y1="8" x2="2" y2="8"/></g>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1d21" stroke="none"/></marker>
  </defs>
  <!-- VMID -->
  <text x="140" y="24" text-anchor="middle" fill="#1b1d21" stroke="none" font-weight="600">VMID = 1.65 V</text>
  <text x="60" y="50" text-anchor="middle" fill="#1b1d21" stroke="none">+3V3A</text>
  <line x1="60" y1="56" x2="60" y2="70"/><rect x="53" y="70" width="14" height="36"/><text x="46" y="92" text-anchor="end" fill="#1b1d21" stroke="none">R5 10 k</text>
  <line x1="60" y1="106" x2="60" y2="150"/><circle cx="60" cy="130" r="2.5" fill="#1b1d21"/>
  <rect x="53" y="150" width="14" height="36"/><text x="46" y="172" text-anchor="end" fill="#1b1d21" stroke="none">R6 10 k</text>
  <line x1="60" y1="186" x2="60" y2="235"/><use href="#g3" x="60" y="235"/>
  <line x1="60" y1="130" x2="110" y2="130"/><line x1="40" y1="200" x2="40" y2="200"/>
  <line x1="95" y1="130" x2="95" y2="190"/><line x1="83" y1="190" x2="107" y2="190"/><line x1="83" y1="197" x2="107" y2="197"/><line x1="95" y1="197" x2="95" y2="235"/><use href="#g3" x="95" y="235"/>
  <text x="112" y="200" fill="#1b1d21" stroke="none">C2 1 µF</text>
  <path d="M130,100 L130,160 L190,130 Z"/><text x="136" y="122" fill="#1b1d21" stroke="none">+</text><text x="136" y="152" fill="#1b1d21" stroke="none">−</text>
  <line x1="110" y1="130" x2="110" y2="115"/><line x1="110" y1="115" x2="130" y2="115"/>
  <line x1="130" y1="145" x2="120" y2="145"/><line x1="120" y1="145" x2="120" y2="172"/><line x1="120" y1="172" x2="210" y2="172"/><line x1="210" y1="172" x2="210" y2="130"/>
  <line x1="190" y1="130" x2="260" y2="130" marker-end="url(#a3)"/><circle cx="210" cy="130" r="2.5" fill="#1b1d21"/>
  <text x="175" y="88" text-anchor="middle" fill="#1b1d21" stroke="none">U3B (spare half)</text>
  <text x="265" y="134" fill="#1b1d21" stroke="none">VMID</text>
  <text x="265" y="150" fill="#1b1d21" stroke="none" font-size="11">to R3, Rg</text>
  <!-- VTH -->
  <text x="450" y="24" text-anchor="middle" fill="#1b1d21" stroke="none" font-weight="600">VTH (shared threshold)</text>
  <text x="380" y="50" text-anchor="middle" fill="#1b1d21" stroke="none">+3V3A</text>
  <line x1="380" y1="56" x2="380" y2="85"/><rect x="373" y="85" width="14" height="70"/>
  <path d="M410,120 L392,120" marker-end="url(#a3)"/><line x1="410" y1="120" x2="440" y2="120"/>
  <text x="365" y="124" text-anchor="end" fill="#1b1d21" stroke="none">RV1 10 k</text>
  <line x1="380" y1="155" x2="380" y2="235"/><use href="#g3" x="380" y="235"/>
  <rect x="440" y="113" width="40" height="14"/><text x="460" y="106" text-anchor="middle" fill="#1b1d21" stroke="none">R7 10 k</text>
  <line x1="480" y1="120" x2="560" y2="120" marker-end="url(#a3)"/><circle cx="510" cy="120" r="2.5" fill="#1b1d21"/>
  <line x1="510" y1="120" x2="510" y2="185"/><line x1="498" y1="185" x2="522" y2="185"/><line x1="498" y1="192" x2="522" y2="192"/><line x1="510" y1="192" x2="510" y2="235"/><use href="#g3" x="510" y="235"/>
  <text x="528" y="196" fill="#1b1d21" stroke="none">C3 1 µF</text>
  <text x="565" y="124" fill="#1b1d21" stroke="none">VTH</text>
  <text x="565" y="140" fill="#1b1d21" stroke="none" font-size="11">to all U4–U6 −</text>
  <text x="450" y="268" text-anchor="middle" fill="#1b1d21" stroke="none" font-size="11">start at VMID + 100 mV</text>
  <!-- power -->
  <text x="780" y="24" text-anchor="middle" fill="#1b1d21" stroke="none" font-weight="600">Analog supply</text>
  <text x="690" y="74" text-anchor="middle" fill="#1b1d21" stroke="none">Heltec 3V3</text>
  <line x1="690" y1="80" x2="690" y2="100"/><line x1="690" y1="100" x2="720" y2="100"/>
  <rect x="720" y="92" width="40" height="16" rx="6"/><text x="740" y="86" text-anchor="middle" fill="#1b1d21" stroke="none">FB1</text>
  <line x1="760" y1="100" x2="862" y2="100"/><text x="866" y="104" fill="#1b1d21" stroke="none">+3V3A</text>
  <circle cx="790" cy="100" r="2.5" fill="#1b1d21"/><circle cx="840" cy="100" r="2.5" fill="#1b1d21"/>
  <line x1="790" y1="100" x2="790" y2="150"/><line x1="778" y1="150" x2="802" y2="150"/><line x1="778" y1="157" x2="802" y2="157"/><line x1="790" y1="157" x2="790" y2="200"/><use href="#g3" x="790" y="200"/>
  <text x="784" y="230" text-anchor="end" fill="#1b1d21" stroke="none">C4 10 µF</text>
  <line x1="840" y1="100" x2="840" y2="150"/><line x1="828" y1="150" x2="852" y2="150"/><line x1="828" y1="157" x2="852" y2="157"/><line x1="840" y1="157" x2="840" y2="200"/><use href="#g3" x="840" y="200"/>
  <text x="836" y="230" fill="#1b1d21" stroke="none">C5 100 nF</text>
  <text x="780" y="262" text-anchor="middle" fill="#1b1d21" stroke="none" font-size="11">+100 nF at every IC supply pin</text>
</svg>