<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="System wiring: five piezo sensors on the plate back connect by short shielded cables to the analog board, which sends five trigger lines to the Heltec V3 capture pins; the Heltec is powered by a USB power bank and talks over LoRa to a receiver Heltec connected to a laptop." font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="none" stroke="#1b1d21"><rect x="0" y="0" width="1000" height="420" fill="#ffffff" stroke="none"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1d21" stroke="none"/></marker>
  </defs>
  <!-- plate -->
  <rect x="20" y="30" width="130" height="330" rx="6" stroke-dasharray="5 4"/>
  <text x="85" y="22" text-anchor="middle" fill="#1b1d21" stroke="none" font-weight="600">AR500 plate (back face)</text>
  <!-- piezos -->
  <g>
    <circle cx="70" cy="70" r="16"/><text x="70" y="74" text-anchor="middle" fill="#1b1d21" stroke="none">PZ1</text>
    <circle cx="70" cy="135" r="16"/><text x="70" y="139" text-anchor="middle" fill="#1b1d21" stroke="none">PZ2</text>
    <circle cx="70" cy="200" r="16"/><text x="70" y="204" text-anchor="middle" fill="#1b1d21" stroke="none">PZ3</text>
    <circle cx="70" cy="265" r="16"/><text x="70" y="269" text-anchor="middle" fill="#1b1d21" stroke="none">PZ4</text>
    <circle cx="70" cy="330" r="16"/><text x="70" y="334" text-anchor="middle" fill="#1b1d21" stroke="none">PZ5</text>
  </g>
  <!-- coax runs -->
  <g stroke-width="2.5">
    <line x1="86" y1="70" x2="230" y2="70"/><line x1="86" y1="135" x2="230" y2="135"/><line x1="86" y1="200" x2="230" y2="200"/><line x1="86" y1="265" x2="230" y2="265"/><line x1="86" y1="330" x2="230" y2="330"/>
  </g>
  <text x="190" y="58" text-anchor="middle" fill="#1b1d21" stroke="none" font-size="11">coax/STP</text>
  <text x="165" y="388" text-anchor="middle" fill="#1b1d21" stroke="none">≤30 cm, shield → AGND at board only</text>
  <!-- analog board -->
  <rect x="230" y="40" width="230" height="320" rx="8"/>
  <text x="345" y="66" text-anchor="middle" fill="#1b1d21" stroke="none" font-weight="600">Analog board</text>
  <text x="345" y="86" text-anchor="middle" fill="#1b1d21" stroke="none">5 × channel (Fig. 2)</text>
  <text x="345" y="104" text-anchor="middle" fill="#1b1d21" stroke="none">VMID + VTH + power (Fig. 3)</text>
  <text x="345" y="140" text-anchor="middle" fill="#1b1d21" stroke="none">U1, U2, U3: OPA2350</text>
  <text x="345" y="158" text-anchor="middle" fill="#1b1d21" stroke="none">U4, U5, U6: TLV3502</text>
  <text x="345" y="176" text-anchor="middle" fill="#1b1d21" stroke="none">RV1: threshold trim</text>
  <!-- trigger lines -->
  <g stroke="#c2410c">
    <line x1="460" y1="215" x2="640" y2="215" marker-end="url(#a1)"/>
    <line x1="460" y1="240" x2="640" y2="240" marker-end="url(#a1)"/>
    <line x1="460" y1="265" x2="640" y2="265" marker-end="url(#a1)"/>
    <line x1="460" y1="290" x2="640" y2="290" marker-end="url(#a1)"/>
    <line x1="460" y1="315" x2="640" y2="315" marker-end="url(#a1)"/>
  </g>
  <g fill="#1b1d21" stroke="none" font-size="11.5">
    <text x="470" y="210">TRIG1 → GPIO2</text><text x="470" y="235">TRIG2 → GPIO4</text><text x="470" y="260">TRIG3 → GPIO5</text><text x="470" y="285">TRIG4 → GPIO6</text><text x="470" y="310">TRIG5 → GPIO7</text>
  </g>
  <!-- power to board -->
  <line x1="640" y1="120" x2="460" y2="120" marker-end="url(#a1)"/>
  <text x="550" y="112" text-anchor="middle" fill="#1b1d21" stroke="none">3V3 (via FB1)</text>
  <line x1="640" y1="160" x2="460" y2="160"/>
  <text x="550" y="152" text-anchor="middle" fill="#1b1d21" stroke="none">GND</text>
  <!-- heltec -->
  <rect x="640" y="70" width="170" height="280" rx="8"/>
  <text x="725" y="96" text-anchor="middle" fill="#1b1d21" stroke="none" font-weight="600">Heltec WiFi LoRa 32 V3</text>
  <text x="725" y="114" text-anchor="middle" fill="#1b1d21" stroke="none">ESP32-S3 + SX1262</text>
  <text x="725" y="190" text-anchor="middle" fill="#1b1d21" stroke="none">MCPWM capture</text>
  <text x="725" y="206" text-anchor="middle" fill="#1b1d21" stroke="none">×5 (12.5 ns)</text>
  <!-- antenna -->
  <line x1="790" y1="70" x2="790" y2="30"/>
  <path d="M778,18 L790,30 L802,18"/>
  <text x="810" y="34" fill="#1b1d21" stroke="none">915 MHz dipole (U.FL)</text>
  <!-- power bank -->
  <rect x="660" y="380" width="130" height="30" rx="5"/>
  <text x="725" y="399" text-anchor="middle" fill="#1b1d21" stroke="none">USB power bank</text>
  <line x1="725" y1="380" x2="725" y2="350" marker-end="url(#a1)"/>
  <text x="732" y="368" fill="#1b1d21" stroke="none">USB-C 5 V</text>
  <!-- shield -->
  <rect x="220" y="8" width="610" height="372" rx="10" stroke-dasharray="2 5" opacity="0.6"/>
  <text x="525" y="396" text-anchor="middle" fill="#1b1d21" stroke="none" opacity="0.8">steel shield behind plate</text>
  <!-- LoRa link + receiver -->
  <line x1="830" y1="160" x2="900" y2="160" stroke-dasharray="6 4" marker-end="url(#a1)"/>
  <text x="865" y="150" text-anchor="middle" fill="#1b1d21" stroke="none">LoRa</text>
  <text x="865" y="178" text-anchor="middle" fill="#1b1d21" stroke="none">~500 m</text>
  <rect x="900" y="120" width="90" height="80" rx="8"/>
  <text x="945" y="148" text-anchor="middle" fill="#1b1d21" stroke="none" font-weight="600">Receiver</text>
  <text x="945" y="164" text-anchor="middle" fill="#1b1d21" stroke="none">Heltec V3</text>
  <text x="945" y="180" text-anchor="middle" fill="#1b1d21" stroke="none">+ dipole</text>
  <line x1="945" y1="200" x2="945" y2="250" marker-end="url(#a1)"/>
  <text x="952" y="230" fill="#1b1d21" stroke="none">USB</text>
  <rect x="905" y="250" width="80" height="34" rx="5"/>
  <text x="945" y="271" text-anchor="middle" fill="#1b1d21" stroke="none">Laptop/phone</text>
</svg>