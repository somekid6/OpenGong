; OpenGong firmware for the Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262).
;
;   pio run -e target   -t upload    ; board behind the plate
;   pio run -e receiver -t upload    ; board at the firing line
;   pio device monitor
;
; Needs Arduino-ESP32 3.x (ESP-IDF 5 MCPWM capture driver), provided by the
; pioarduino platform below.

[platformio]
default_envs = target, receiver

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.2
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
build_flags =
    -DOG_NET_ID=1
    -Wall

[env:target]
build_src_filter = +<target/>

[env:receiver]
build_src_filter = +<receiver/>
