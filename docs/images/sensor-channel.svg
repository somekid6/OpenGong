<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 350" role="img" aria-label="One channel: piezo through a 10 k series resistor and BAV99 clamp, a 1 nF and 3.3 k high-pass to VMID, an OPA2350 non-inverting amplifier with gain 10, then a TLV3502 comparator against VTH whose output goes through 100 ohms to an ESP32 capture pin." font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="none" stroke="#1b1d21" stroke-width="1.5"><rect x="0" y="0" width="930" height="350" fill="#ffffff" stroke="none"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1d21" stroke="none"/></marker>
    <g id="gnd"><line x1="-10" y1="0" x2="10" y2="0"/><line x1="-6" y1="4" x2="6" y2="4"/><line x1="-2" y1="8" x2="2" y2="8"/></g>
  </defs>
  <!-- board outline -->
  <rect x="110" y="20" width="720" height="318" rx="8" stroke-dasharray="5 4" opacity="0.55"/>
  <text x="120" y="38" fill="#1b1d21" stroke="none" opacity="0.8">analog board</text>
  <!-- piezo -->
  <circle cx="55" cy="170" r="22"/>
  <line x1="43" y1="160" x2="67" y2="160"/><line x1="43" y1="180" x2="67" y2="180"/>
  <text x="22" y="215" text-anchor="middle" fill="#1b1d21" stroke="none">PZn</text>
  <text x="4" y="245" fill="#1b1d21" stroke="none" font-size="11">Ø12–15</text><text x="8" y="259" fill="#1b1d21" stroke="none" font-size="11">glued</text>
  <line x1="55" y1="148" x2="55" y2="110"/><line x1="55" y1="110" x2="120" y2="110"/>
  <line x1="55" y1="192" x2="55" y2="285"/><use href="#gnd" x="55" y="285"/>
  <circle cx="120" cy="110" r="4"/>
  <text x="120" y="96" text-anchor="middle" fill="#1b1d21" stroke="none">Jn</text>
  <!-- node P / R2 -->
  <line x1="124" y1="110" x2="175" y2="110"/>
  <circle cx="145" cy="110" r="2.5" fill="#1b1d21"/>
  <line x1="145" y1="110" x2="145" y2="160"/><rect x="138" y="160" width="14" height="40"/><line x1="145" y1="200" x2="145" y2="285"/><use href="#gnd" x="145" y="285"/>
  <text x="158" y="184" fill="#1b1d21" stroke="none">R2 1 M</text>
  <!-- R1 -->
  <rect x="175" y="103" width="44" height="14"/><text x="197" y="94" text-anchor="middle" fill="#1b1d21" stroke="none">R1 10 k</text>
  <line x1="219" y1="110" x2="300" y2="110"/>
  <!-- node A clamps -->
  <circle cx="255" cy="110" r="2.5" fill="#1b1d21"/>
  <line x1="255" y1="110" x2="255" y2="90"/>
  <path d="M245,90 L265,90 L255,74 Z"/><line x1="245" y1="72" x2="265" y2="72"/>
  <line x1="255" y1="72" x2="255" y2="55"/><text x="255" y="49" text-anchor="middle" fill="#1b1d21" stroke="none">+3V3A</text>
  <line x1="255" y1="110" x2="255" y2="128"/>
  <line x1="245" y1="130" x2="265" y2="130"/><path d="M245,148 L265,148 L255,132 Z"/>
  <line x1="255" y1="148" x2="255" y2="285"/><use href="#gnd" x="255" y="285"/>
  <text x="270" y="140" fill="#1b1d21" stroke="none">D1</text><text x="270" y="154" fill="#1b1d21" stroke="none">BAV99</text>
  <!-- C1 -->
  <line x1="300" y1="96" x2="300" y2="124"/><line x1="308" y1="96" x2="308" y2="124"/>
  <text x="304" y="88" text-anchor="middle" fill="#1b1d21" stroke="none">C1 1 nF</text>
  <line x1="308" y1="110" x2="420" y2="110"/>
  <!-- node B R3 -->
  <circle cx="350" cy="110" r="2.5" fill="#1b1d21"/>
  <line x1="350" y1="110" x2="350" y2="160"/><rect x="343" y="160" width="14" height="40"/><line x1="350" y1="200" x2="350" y2="225"/>
  <text x="337" y="184" text-anchor="end" fill="#1b1d21" stroke="none">R3 3.3 k</text>
  <text x="350" y="240" text-anchor="middle" fill="#1b1d21" stroke="none">VMID</text>
  <text x="350" y="62" text-anchor="middle" fill="#1b1d21" stroke="none" font-size="11">HPF ≈ 48 kHz</text>
  <!-- op-amp -->
  <path d="M420,85 L420,175 L505,130 Z"/>
  <text x="428" y="114" fill="#1b1d21" stroke="none">+</text><text x="428" y="155" fill="#1b1d21" stroke="none">−</text>
  <text x="462" y="74" text-anchor="middle" fill="#1b1d21" stroke="none">U1A OPA2350</text>
  <line x1="420" y1="150" x2="400" y2="150"/><line x1="400" y1="150" x2="400" y2="265"/>
  <circle cx="400" cy="235" r="2.5" fill="#1b1d21"/>
  <line x1="400" y1="235" x2="445" y2="235"/><rect x="445" y="228" width="44" height="14"/><line x1="489" y1="235" x2="540" y2="235"/><line x1="540" y1="235" x2="540" y2="130"/>
  <text x="467" y="222" text-anchor="middle" fill="#1b1d21" stroke="none">Rf 9.1 k</text>
  <rect x="393" y="265" width="14" height="34"/><line x1="400" y1="299" x2="400" y2="310"/>
  <text x="378" y="287" text-anchor="end" fill="#1b1d21" stroke="none">Rg 1 k</text>
  <text x="400" y="322" text-anchor="middle" fill="#1b1d21" stroke="none">VMID</text>
  <line x1="505" y1="130" x2="580" y2="130"/><circle cx="540" cy="130" r="2.5" fill="#1b1d21"/>
  <text x="560" y="122" text-anchor="middle" fill="#1b1d21" stroke="none" font-size="11">gain 10</text>
  <!-- comparator -->
  <line x1="580" y1="130" x2="580" y2="110"/><line x1="580" y1="110" x2="620" y2="110"/>
  <path d="M620,85 L620,175 L705,130 Z"/>
  <text x="628" y="114" fill="#1b1d21" stroke="none">+</text><text x="628" y="155" fill="#1b1d21" stroke="none">−</text>
  <text x="662" y="74" text-anchor="middle" fill="#1b1d21" stroke="none">U4A TLV3502</text>
  <line x1="590" y1="150" x2="620" y2="150"/><text x="586" y="154" text-anchor="end" fill="#1b1d21" stroke="none">VTH</text>
  <!-- output -->
  <g stroke="#c2410c">
    <line x1="705" y1="130" x2="730" y2="130"/><rect x="730" y="123" width="40" height="14"/><line x1="770" y1="130" x2="850" y2="130" marker-end="url(#a2)"/>
  </g>
  <text x="750" y="114" text-anchor="middle" fill="#1b1d21" stroke="none">R4 100 Ω</text>
  <text x="858" y="126" fill="#1b1d21" stroke="none">TRIGn</text>
  <text x="858" y="142" fill="#1b1d21" stroke="none" font-size="11">→ GPIO</text>
</svg>